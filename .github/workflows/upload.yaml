name: Upload

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      asset-prefix: ${{ steps.asset-path.outputs.prefix }}
      asset-base-url: ${{ steps.asset-path.outputs.base-url }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          package-manager-cache: false

      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"
          deps-file: deps.cirru

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          yarn --version

      - name: Install and validate dependencies
        run: |
          set -euo pipefail
          test ! -e compact.cirru
          test ! -e package.cirru
          caps --strict --ci
          yarn install --immutable
          caps verify --toolchain

      - name: Run MathML smoke test
        run: yarn test:mathml

      - name: Run incremental parser benchmark
        run: yarn test:incremental

      - name: Check deprecated APIs
        run: yarn check:deprecated | jq -e '.data.summary.calls == 0'

      - name: Check Calcit snapshot
        run: |
          set -euo pipefail
          calcit calcit.cirru edit format
          git diff --quiet --exit-code -- calcit.cirru
          calcit calcit.cirru --check-only --all-defs --format json
          calcit fix --workflow strict --verify --format json | jq -e '.data.workflow.status == "passed" and .diagnostics == []'
          calcit calcit.cirru --entry smoke-test --check-only
          calcit calcit.cirru --entry perf-test --check-only
          calcit --check-only --ns respo-md.comp.container --ns respo-md.comp.md --ns respo-md.config --ns respo-md.main --ns respo-md.schema --ns respo-md.util.core --ns respo-md.util.math --summary-only --format json
          calcit analyze weak-types --only dynamic-method --summary-only --format json | jq -e '.data.summary.findings == 0'
          calcit test --exclude-tag js-only --require-match --summary-only --format json

      - name: Build client with CDN asset URLs
        id: asset-path
        env:
          CDN_ORIGIN: https://cos-sh.tiye.me
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            asset_prefix="${GITHUB_REPOSITORY}/pr/${{ github.event.pull_request.number }}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/"
          else
            asset_prefix="${GITHUB_REPOSITORY}/"
          fi
          export VITE_BASE_URL="${CDN_ORIGIN}/${asset_prefix}"
          echo "VITE_BASE_URL=${VITE_BASE_URL}" >> "$GITHUB_ENV"
          echo "prefix=${asset_prefix}" >> "$GITHUB_OUTPUT"
          echo "base-url=${VITE_BASE_URL}" >> "$GITHUB_OUTPUT"
          calcit calcit.cirru js
          node --test scripts/inline-render.test.mjs
          yarn vite build --base="$VITE_BASE_URL"

      - name: 保存已验证的前端构建
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v7.0.2
        with:
          name: client-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  upload:
    name: 上传前端产物
    needs: test
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: cos-${{ github.repository }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: 下载本次运行的前端构建
        uses: actions/download-artifact@v8.0.2
        with:
          name: client-dist
          path: dist/

      - name: Upload static assets to COS
        timeout-minutes: 10
        uses: worktools/cos-upload-action@v1.2.0
        with:
          source-dir: dist
          bucket: ${{ secrets.COS_BUCKET }}
          region: ap-shanghai
          prefix: ${{ needs.test.outputs.asset-prefix }}
          public-base-url: ${{ needs.test.outputs.asset-base-url }}
          secret-id: ${{ secrets.COS_SECRET_ID }}
          secret-key: ${{ secrets.COS_SECRET_KEY }}

      - name: Deploy to server
        id: deploy
        if: github.ref == 'refs/heads/main'
        uses: Pendect/action-rsyncer@v2.0.0
        env:
          DEPLOY_KEY: ${{secrets.rsync_private_key}}
        with:
          flags: "-avzr --progress"
          options: ""
          ssh_options: ""
          src: "dist/*"
          dest: "rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}"

      - name: Display status from deploy
        if: github.ref == 'refs/heads/main'
        run: echo "${{ steps.deploy.outputs.status }}"
