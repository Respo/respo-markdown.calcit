name: Upload

on:
  push: {}
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: calcit-lang/setup-cr@0.0.9

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate
          yarn --version

      - name: Install and validate dependencies
        run: |
          caps --ci
          yarn install --immutable

      - name: Run MathML smoke test
        run: yarn test:mathml

      - name: Run incremental parser benchmark
        run: yarn test:incremental

      - name: Check deprecated APIs
        run: yarn check:deprecated

      - name: Check Calcit snapshot
        run: cr calcit.cirru --check-only

      - name: Validate Calcit type baseline
        run: |
          cr calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          cr calcit.cirru analyze check-types --summary-only --format json
          cr calcit.cirru analyze weak-types --only schema-dynamic,code-dynamic --intent unresolved --summary-only --format json

      - name: Compile and build site
        run: cr calcit.cirru js && yarn vite build --base=./

      - name: Deploy to server
        id: deploy
        if: github.ref == 'refs/heads/main'
        uses: Pendect/action-rsyncer@v2.0.0
        env:
          DEPLOY_KEY: ${{secrets.rsync_private_key}}
        with:
          flags: "-avzr --progress"
          options: ""
          ssh_options: ""
          src: "dist/*"
          dest: "rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}"

      - name: Display status from deploy
        if: github.ref == 'refs/heads/main'
        run: echo "${{ steps.deploy.outputs.status }}"
