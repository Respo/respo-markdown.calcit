name: Upload

on:
  push: {}
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    outputs:
      asset-prefix: ${{ steps.asset-path.outputs.prefix }}
      asset-base-url: ${{ steps.asset-path.outputs.base-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false

      - uses: calcit-lang/setup-calcit@ca701be5a471759e442aa053cd100720bbe1f09f # v1.5.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          yarn --version

      - name: Install and validate dependencies
        run: |
          set -euo pipefail
          test ! -e compact.cirru
          test ! -e package.cirru
          caps --strict --ci
          yarn install --immutable
          caps verify --toolchain

      - name: Run MathML smoke test
        run: yarn test:mathml

      - name: Run incremental parser benchmark
        run: yarn test:incremental

      - name: Check deprecated APIs
        run: yarn check:deprecated

      - name: Check Calcit snapshot
        run: |
          set -euo pipefail
          calcit calcit.cirru fix --workflow strict --verify --format edn
          calcit calcit.cirru --check-only
          calcit calcit.cirru --entry smoke-test --check-only
          calcit calcit.cirru --entry perf-test --check-only
          calcit analyze check-public --ns respo-md.comp.container --ns respo-md.comp.md --ns respo-md.config --ns respo-md.main --ns respo-md.schema --ns respo-md.util.core --ns respo-md.util.math --summary-only
          calcit calcit.cirru analyze dynamic-methods --summary-only --format json | jq -e '.data.summary.findings == 0'

      - name: Validate Calcit type baseline
        run: |
          set -euo pipefail
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          mkdir -p .calcit
          calcit calcit.cirru analyze check-types --summary-only --format json > .calcit/check-types.json
          calcit calcit.cirru analyze weak-types --only schema-dynamic,code-dynamic,code-nil --intent unresolved,declared-optional --summary-only --format json > .calcit/weak-types.json
          calcit calcit.cirru analyze deprecated --summary-only --format json > .calcit/deprecated.json
          node scripts/check-calcit-upgrade-baseline.mjs

      - name: Build client with CDN asset URLs
        id: asset-path
        env:
          CDN_ORIGIN: https://cos-sh.tiye.me
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            asset_prefix="${GITHUB_REPOSITORY}/pr/"
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            asset_prefix="${GITHUB_REPOSITORY}/"
          else
            asset_prefix="${GITHUB_REPOSITORY}/branches/${GITHUB_REF_NAME}/"
          fi
          export VITE_BASE_URL="${CDN_ORIGIN}/${asset_prefix}"
          echo "VITE_BASE_URL=${VITE_BASE_URL}" >> "$GITHUB_ENV"
          echo "prefix=${asset_prefix}" >> "$GITHUB_OUTPUT"
          echo "base-url=${VITE_BASE_URL}" >> "$GITHUB_OUTPUT"
          calcit calcit.cirru js
          node --test scripts/inline-render.test.mjs
          yarn vite build --base="$VITE_BASE_URL"

      - name: 保存已验证的前端构建
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: client-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  upload:
    name: 上传前端产物
    needs: test
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    concurrency:
      group: cos-${{ github.repository }}-${{ github.event_name == 'pull_request' && 'pr' || github.ref }}
      cancel-in-progress: false
    steps:
      - name: 下载本次运行的前端构建
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: client-dist
          path: dist/

      - name: Upload static assets to COS
        uses: worktools/cos-upload-action@17e6d213fe9f6772a6090a13c8ba044cd6cbcb09 # v1.1.1
        with:
          source-dir: dist
          bucket: ${{ secrets.COS_BUCKET }}
          region: ap-shanghai
          prefix: ${{ needs.test.outputs.asset-prefix }}
          public-base-url: ${{ needs.test.outputs.asset-base-url }}
          secret-id: ${{ secrets.COS_SECRET_ID }}
          secret-key: ${{ secrets.COS_SECRET_KEY }}

      - name: Deploy to server
        id: deploy
        if: github.ref == 'refs/heads/main'
        uses: Pendect/action-rsyncer@8e05ffa5c93e5d9c9b167796b26044d2c616b2b9 # v2.0.0
        env:
          DEPLOY_KEY: ${{secrets.rsync_private_key}}
        with:
          flags: "-avzr --progress"
          options: ""
          ssh_options: ""
          src: "dist/*"
          dest: "rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}"

      - name: Display status from deploy
        if: github.ref == 'refs/heads/main'
        run: echo "${{ steps.deploy.outputs.status }}"
